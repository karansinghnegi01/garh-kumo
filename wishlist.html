<h1 class="title">Your Wishlist</h1>

<div class="wishlist-container" id="wishlist"></div>

<script>
const defaultWishlist = [
  { name: "Kedarnath", src: "kedarnath2.jpeg", type: "image" },
  { name: "Badrinath", src: "badrinath.mp4", type: "video" },
  { name: "Nainital", src: "nainitallake01.webp", type: "image" },
  { name: "Rishikesh", src: "rishikesh.mp4", type: "video" }
];

const mediaMap = defaultWishlist.reduce((map, item) => {
  map[item.name] = item;
  return map;
}, {});

function normalizeItem(item) {
  if (typeof item === "object" && item !== null && item.name) {
    return item;
  }
  if (typeof item === "string") {
    return mediaMap[item] || { name: item, src: "logo2.jpeg", type: "image" };
  }
  return { name: "Unknown", src: "logo2.jpeg", type: "image" };
}

let data = JSON.parse(localStorage.getItem("wishlist")) || [];

data = data.map(normalizeItem);

if (data.length === 0) {
  data = defaultWishlist.slice();
  localStorage.setItem("wishlist", JSON.stringify(data));
}

let container = document.getElementById("wishlist");

function renderWishlist() {
  container.innerHTML = "";

  if (data.length === 0) {
    container.innerHTML = "<p class='empty'>No items in wishlist</p>";
    return;
  }

  data.forEach((item, index) => {
    let div = document.createElement("div");
    div.className = "wish-card";

    let mediaMarkup = item.type === "video"
      ? `<video class="wish-media" src="${item.src}" muted loop autoplay playsinline></video>`
      : `<img class="wish-media" src="${item.src}" alt="${item.name}">`;

    div.innerHTML = `
      ${mediaMarkup}
      <h3>${item.name}</h3>
      <button onclick="removeItem(${index})">Remove</button>
    `;

    container.appendChild(div);
  });
}

function removeItem(i) {
  data.splice(i, 1);
  localStorage.setItem("wishlist", JSON.stringify(data));
  renderWishlist();
}

renderWishlist();
</script>
<script>
    function toggleMenu(){
      document.getElementById("menuBox").classList.toggle("active");
      document.getElementById("overlay").classList.toggle("active");
    }
    
    function toggleSubMenu(){
      document.getElementById("submenu").classList.toggle("active");
    }
    
    function toggleLoginMenu(){
      document.getElementById("loginMenu").classList.toggle("active");
    }
    
    // USER SHOW
    window.addEventListener("load", function(){
      let user = localStorage.getItem("user");
      if(user){
        document.getElementById("userDisplay").innerText = user + " ▾";
      }
    });
    
    // LOGOUT
    function logoutUser(){
      localStorage.removeItem("user");
      alert("Logged out ❌");
      location.reload();
    }
    </script>
</body>
