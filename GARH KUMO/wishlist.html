  <!-- CLOSE -->

  <a href="index.html">Home</a>

  <!-- DESTINATIONS -->
  <div class="menu-item" onclick="toggleSubMenu()">

  <div class="submenu" id="submenu">

</div>
<h1 class="title">Your Wishlist</h1>

<div class="wishlist-container" id="wishlist"></div>
<h2>Your Wishlist ❤️</h2>
<div id="list"></div>

<script>
let list = JSON.parse(localStorage.getItem("wishlist")) || [];

let box = document.getElementById("list");

list.forEach(item => {
  let div = document.createElement("div");
  div.innerHTML = item;
  box.appendChild(div);
});
</script>
<script>
let data = JSON.parse(localStorage.getItem("wishlist")) || [];

let container = document.getElementById("wishlist");

function renderWishlist(){
  container.innerHTML = "";

  if(data.length === 0){
    container.innerHTML = "<p class='empty'>No items in wishlist </p>";
    return;
  }

  data.forEach((item, index) => {

    let div = document.createElement("div");
    div.className = "wish-card";

    div.innerHTML = `
      <h3>${item}</h3>
      <button onclick="removeItem(${index})">Remove</button>
    `;

    container.appendChild(div);
  });
}

function removeItem(i){
  data.splice(i, 1);
  localStorage.setItem("wishlist", JSON.stringify(data));
  renderWishlist();
}

renderWishlist();

</script>
<script>
    function toggleMenu(){
      document.getElementById("menuBox").classList.toggle("active");
      document.getElementById("overlay").classList.toggle("active");
    }
    
    function toggleSubMenu(){
      document.getElementById("submenu").classList.toggle("active");
    }
    
    function toggleLoginMenu(){
      document.getElementById("loginMenu").classList.toggle("active");
    }
    
    // USER SHOW
    window.addEventListener("load", function(){
      let user = localStorage.getItem("user");
      if(user){
        document.getElementById("userDisplay").innerText = user + " ▾";
      }
    });
    
    // LOGOUT
    function logoutUser(){
      localStorage.removeItem("user");
      alert("Logged out ❌");
      location.reload();
    }
    </script>
</body>
