<!-- 🔍 SEARCH -->
<div class="explore-header">
  <h1>Explore Uttarakhand</h1>
  <input type="text" id="searchPlace" placeholder="Search destinations...">
</div>


<!-- 👇 YAHAN DAAL -->
<div class="filters">
  <button onclick="filterPlaces('all')">All</button>
  <button onclick="filterPlaces('temple')">Temple</button>
  <button onclick="filterPlaces('hill')">Hill</button>
  <button onclick="filterPlaces('snow')">Snow</button>
</div>

<!-- 🌍 CARDS -->
<div class="explore-container" id="places">

  <div class="place-card">
    <img src="kedarnath.jpg">
    <div class="overlay-text">
      <h2>Kedarnath</h2>
    </div>
  </div>

  <div class="place-card">
    <img src="badrinath.jpg">
    <div class="overlay-text">
      <h2>Badrinath</h2>
    </div>
  </div>

  <div class="place-card">
    <img src="nainital.jpg">
    <div class="overlay-text">
      <h2>Nainital</h2>
    </div>
  </div>

  <div class="place-card">
    <img src="rishikesh.jpg">
    <div class="overlay-text">
      <h2>Rishikesh</h2>
    </div>
  </div>

  <div class="place-card">
    <img src="auli.jpg">
    <div class="overlay-text">
      <h2>Auli</h2>
    </div>
  </div>

  <div class="place-card">
    <img src="mussoorie.jpg">
    <div class="overlay-text">
      <h2>Mussoorie</h2>
    </div>
  </div>

</div>
<div class="place-card" data-type="temple" onclick="openPage('kedarnath.html')"></div>

<script src="explore.js">
  function filterPlaces(type){
  document.querySelectorAll(".place-card").forEach(card=>{
    if(type === "all" || card.dataset.type === type){
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  });
}

function openPage(page){
  window.location.href = page;
}
window.addEventListener("scroll", ()=>{
  document.querySelectorAll(".place-card").forEach(card=>{
    let top = card.getBoundingClientRect().top;

    if(top < window.innerHeight - 50){
      card.classList.add("show");
    }
  });
});
</script>

</body>
</html>
