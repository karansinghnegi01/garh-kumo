<!DOCTYPE html>
<html>
<head>
<title>Booking</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Booking Page</h1>

<p id="hotelName"></p>

<form>
  <input type="text" placeholder="Your Name"><br><br>
  <input type="date"><br><br>
  <input type="number" placeholder="Guests"><br><br>
  <button>Confirm Booking</button>
</form>

<script>
document.getElementById("hotelName").innerText =
"Booking for: " + localStorage.getItem("hotelName");
</script>

</body>
</html>
