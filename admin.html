<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel - GarhKumo</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<h1>🏔️ GarhKumo Admin Panel</h1>

<div class="container">

  <h2>Add Hotel</h2>

  <input id="name" type="text" placeholder="Hotel Name">
  <input id="place" type="text" placeholder="Place">
  <input id="price" type="number" placeholder="Price">

  <select id="category">
    <option>Luxury</option>
    <option>Mid-range</option>
    <option>Budget</option>
  </select>

  <button onclick="addHotel()">➕ Add Hotel</button>

  <hr>

  <h2>Hotel List</h2>
  <div id="hotelList"></div>

</div>

<script src="admin.js"></script>

</body>
</html>
